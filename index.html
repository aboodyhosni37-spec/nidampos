<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (["/", "/about", "/menu", "/contact", "/order", "/checkout", "/order-status"].includes(location.pathname.replace(/\/$/, "") || "/")) {
        document.documentElement.classList.add("customer-boot");
        // Also recover if application scripts cannot start at all.
        window.setTimeout(function () {
          document.documentElement.classList.remove("customer-boot");
          var screen = document.getElementById("customer-loading");
          if (screen) screen.remove();
        }, 15000);
      }
    </script>
    <link rel="stylesheet" href="/customer-loading.css" />
    <title>LamaHamar Cafe — Cuntada Dalka</title>
    <meta name="description" content="LamaHamar Cafe in Mogadishu: freshly brewed coffee, breakfast, sandwiches and desserts. Browse the menu and order for delivery or dine-in.">
    <meta name="author" content="LamaHamar Cafe" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://https-lamahamarcafe-c37fc-web-app.lovable.app/og-lamahamar-cafe.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://https-lamahamarcafe-c37fc-web-app.lovable.app/og-lamahamar-cafe.png">
  <meta property="og:title" content="LamaHamar Cafe — Cuntada Dalka">
  <meta name="twitter:title" content="LamaHamar Cafe — Cuntada Dalka">
  <meta property="og:description" content="Freshly brewed coffee, breakfast and fresh food in Mogadishu. Browse the menu and order for delivery or dine-in.">
  <meta name="twitter:description" content="Freshly brewed coffee, breakfast and fresh food in Mogadishu. Browse the menu and order for delivery or dine-in.">

</head>

  <body>
    <div id="customer-loading" class="customer-loading" role="status" aria-live="polite" aria-label="Loading LamaHamar Cafe">
      <div class="customer-loading-content">
        <div class="customer-loading-circle" role="progressbar" aria-label="Website loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="customer-loading-track" cx="60" cy="60" r="56" />
            <circle class="customer-loading-ring" cx="60" cy="60" r="56" pathLength="100" />
          </svg>
          <span class="customer-loading-percentage" aria-hidden="true">0%</span>
        </div>
        <p class="customer-loading-title">Preparing Your Experience…</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
